# --------------------------------- Redis ------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: b2b
  labels: { app: redis }
spec:
  clusterIP: None
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: b2b
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7
          # Keyspace notifications (Ex) are required by the reservation expiry reaper.
          args: ["redis-server", "--appendonly", "yes", "--notify-keyspace-events", "Ex"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 2Gi } }
---
# ------------------------------ ElasticSearch -------------------------------
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: b2b
  labels: { app: elasticsearch }
spec:
  clusterIP: None
  selector: { app: elasticsearch }
  ports: [{ name: http, port: 9200, targetPort: 9200 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: b2b
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      # ES needs vm.max_map_count >= 262144; set it via an init container with privileges.
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext: { privileged: true }
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          ports: [{ name: http, containerPort: 9200 }]
          env:
            - { name: discovery.type, value: "single-node" }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m" }
          readinessProbe:
            httpGet: { path: /_cluster/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }

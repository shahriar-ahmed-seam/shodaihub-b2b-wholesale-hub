# ============================================================================
# Datastores — Postgres (x3), Redis, ElasticSearch.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ PRODUCTION RECOMMENDATION: use MANAGED datastores instead of these        │
# │ in-cluster StatefulSets. Point the ConfigMap/Secret URLs at:              │
# │   - Managed PostgreSQL (RDS / Cloud SQL / Render PostgreSQL) — one DB or  │
# │     instance per service (auth, inventory, notifications, payment).        │
# │   - Managed Redis (ElastiCache / Memorystore / Render Redis).             │
# │   - Managed ElasticSearch (Elastic Cloud / OpenSearch Service).           │
# │ Then DELETE this file before applying — the app Deployments need no change │
# │ because they read endpoints from b2b-config / b2b-secrets.                │
# └─────────────────────────────────────────────────────────────────────────┘
#
# The StatefulSets below exist so the stack can run end-to-end on a bare
# cluster (dev / self-hosted) without external dependencies. They use modest
# PVCs and are NOT tuned for production durability/HA.
#
# CREDENTIALS NOTE: these dev StatefulSets all read their POSTGRES_PASSWORD from
# the single `INVENTORY_DB_PASSWORD` Secret key for simplicity. If you keep them,
# make sure each service's `*_DB_URL` password in 02-secret.yaml matches this
# value. For production with managed datastores this coupling goes away (each
# service just gets its own connection-string Secret).
# ============================================================================

# ----------------------------- Postgres (auth) -----------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
  namespace: b2b
  labels: { app: postgres-auth }
spec:
  clusterIP: None
  selector: { app: postgres-auth }
  ports: [{ name: pg, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-auth
  namespace: b2b
spec:
  serviceName: postgres-auth
  replicas: 1
  selector:
    matchLabels: { app: postgres-auth }
  template:
    metadata:
      labels: { app: postgres-auth }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: "auth" }
            - { name: POSTGRES_USER, value: "auth" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: b2b-secrets, key: INVENTORY_DB_PASSWORD } }
            - { name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "auth", "-d", "auth"] }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---

# ============================================================================
# Secret — credentials and provider secrets (Req 19.4).
#
# THIS FILE CONTAINS PLACEHOLDERS ONLY. Do NOT commit real secrets. Replace the
# placeholder values before applying, or (recommended) generate the Secret out
# of band and keep it out of version control:
#
#     kubectl create secret generic b2b-secrets -n b2b \
#       --from-literal=AUTH_DB_URL='postgres://...' \
#       --from-literal=JWT_PRIVATE_KEY="$(cat jwt_private.pem)" \
#       --from-literal=JWT_PUBLIC_KEY="$(cat jwt_public.pem)" \
#       ... (one --from-literal per key below)
#
# In production prefer a sealed-secrets controller, External Secrets Operator,
# or a cloud secret manager (AWS Secrets Manager / GCP Secret Manager) rather
# than a plaintext manifest.
#
# `stringData` lets you paste raw values; Kubernetes base64-encodes them.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: b2b-secrets
  namespace: b2b
type: Opaque
stringData:
  # --- Per-service Postgres connection strings ---
  AUTH_DB_URL: "postgres://auth:CHANGE_ME@postgres-auth:5432/auth"
  INVENTORY_DB_URL: "jdbc:postgresql://postgres-inventory:5432/inventory"
  INVENTORY_DB_USER: "inventory"
  INVENTORY_DB_PASSWORD: "CHANGE_ME"
  NOTIF_DB_URL: "postgres://notifications:CHANGE_ME@postgres-notif:5432/notifications"
  PAYMENT_DB_URL: "postgres://payment:CHANGE_ME@postgres-payment:5432/payment"

  # --- JWT RS256 keypair (PEM). Auth signs with the private key; BFF + Auth verify with the public key. ---
  JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_RS256_PRIVATE_KEY
    -----END PRIVATE KEY-----
  JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    REPLACE_WITH_RS256_PUBLIC_KEY
    -----END PUBLIC KEY-----

  # --- Payment provider secrets (bKash / Nagad / SSLCommerz) ---
  BKASH_API_KEY: "CHANGE_ME"
  BKASH_API_SECRET: "CHANGE_ME"
  NAGAD_MERCHANT_ID: "CHANGE_ME"
  NAGAD_API_SECRET: "CHANGE_ME"
  SSLCOMMERZ_STORE_ID: "CHANGE_ME"
  SSLCOMMERZ_STORE_PASSWORD: "CHANGE_ME"

# ============================================================================
# API Gateway / BFF — Deployment + ClusterIP Service + HorizontalPodAutoscaler.
# This is the ONLY service exposed publicly, via the Ingress (40-ingress.yaml).
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: b2b
  labels: { app: bff, app.kubernetes.io/part-of: b2b-wholesale-hub }
spec:
  replicas: 2
  selector:
    matchLabels: { app: bff }
  template:
    metadata:
      labels: { app: bff }
    spec:
      containers:
        - name: bff
          image: b2b/bff:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: NODE_ENV,  valueFrom: { configMapKeyRef: { name: b2b-config, key: NODE_ENV } } }
            - { name: LOG_LEVEL, valueFrom: { configMapKeyRef: { name: b2b-config, key: LOG_LEVEL } } }
            - { name: BFF_PORT,  valueFrom: { configMapKeyRef: { name: b2b-config, key: BFF_PORT } } }
            - { name: AUTH_SERVICE_URL,      valueFrom: { configMapKeyRef: { name: b2b-config, key: AUTH_SERVICE_URL } } }
            - { name: INVENTORY_SERVICE_URL, valueFrom: { configMapKeyRef: { name: b2b-config, key: INVENTORY_SERVICE_URL } } }
            - { name: SEARCH_SERVICE_URL,    valueFrom: { configMapKeyRef: { name: b2b-config, key: SEARCH_SERVICE_URL } } }
            - { name: PAYMENT_SERVICE_URL,   valueFrom: { configMapKeyRef: { name: b2b-config, key: PAYMENT_SERVICE_URL } } }
            - { name: JWT_PUBLIC_KEY, valueFrom: { secretKeyRef: { name: b2b-secrets, key: JWT_PUBLIC_KEY } } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: b2b
  labels: { app: bff }
spec:
  type: ClusterIP
  selector: { app: bff }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bff
  namespace: b2b
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bff
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

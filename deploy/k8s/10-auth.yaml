# ============================================================================
# Auth Service — Deployment + ClusterIP Service + HorizontalPodAutoscaler.
# Internal only (never exposed by the Ingress). Node.js 20 runtime image.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: b2b
  labels: { app: auth, app.kubernetes.io/part-of: b2b-wholesale-hub }
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      containers:
        - name: auth
          # CI rewrites this to the pushed registry image, e.g. ghcr.io/<org>/b2b-auth:<sha>.
          image: b2b/auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3001 }
          env:
            - { name: NODE_ENV,  valueFrom: { configMapKeyRef: { name: b2b-config, key: NODE_ENV } } }
            - { name: LOG_LEVEL, valueFrom: { configMapKeyRef: { name: b2b-config, key: LOG_LEVEL } } }
            - { name: AUTH_PORT, valueFrom: { configMapKeyRef: { name: b2b-config, key: AUTH_PORT } } }
            - { name: AUTH_DB_URL,     valueFrom: { secretKeyRef: { name: b2b-secrets, key: AUTH_DB_URL } } }
            - { name: JWT_PRIVATE_KEY, valueFrom: { secretKeyRef: { name: b2b-secrets, key: JWT_PRIVATE_KEY } } }
            - { name: JWT_PUBLIC_KEY,  valueFrom: { secretKeyRef: { name: b2b-secrets, key: JWT_PUBLIC_KEY } } }
          readinessProbe:
            httpGet: { path: /auth/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /auth/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: b2b
  labels: { app: auth }
spec:
  type: ClusterIP
  selector: { app: auth }
  ports:
    - { name: http, port: 3001, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth
  namespace: b2b
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

# ============================================================================
# Search Service — Deployment + ClusterIP Service + HorizontalPodAutoscaler.
# Internal only. Python 3.12 / FastAPI runtime image. Talks to ElasticSearch + Redis.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: b2b
  labels: { app: search, app.kubernetes.io/part-of: b2b-wholesale-hub }
spec:
  replicas: 2
  selector:
    matchLabels: { app: search }
  template:
    metadata:
      labels: { app: search }
    spec:
      containers:
        - name: search
          image: b2b/search:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: LOG_LEVEL,         valueFrom: { configMapKeyRef: { name: b2b-config, key: LOG_LEVEL } } }
            - { name: SEARCH_PORT,       valueFrom: { configMapKeyRef: { name: b2b-config, key: SEARCH_PORT } } }
            - { name: ELASTICSEARCH_URL, valueFrom: { configMapKeyRef: { name: b2b-config, key: ELASTICSEARCH_URL } } }
            - { name: REDIS_URL,         valueFrom: { configMapKeyRef: { name: b2b-config, key: REDIS_URL } } }
          readinessProbe:
            httpGet: { path: /search/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /search/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "750m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: b2b
  labels: { app: search }
spec:
  type: ClusterIP
  selector: { app: search }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search
  namespace: b2b
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

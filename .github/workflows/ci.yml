# ============================================================================
# CI — build + test every service on PRs and pushes (Req 20.3, 20.5).
#
# One job per stack, each pinned to its language. Property + integration tests
# that need datastores use Testcontainers, which works on GitHub-hosted runners
# because Docker is preinstalled. Property tests run a minimum of 100 iterations
# (jqwik / fast-check / Hypothesis) as fixed by the design.
# ============================================================================
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------- Node workspaces -------------------------------
  # auth / bff / payment / notification share the root lockfile and depend on
  # @b2b/shared-node, so each job installs once at the root, builds the shared
  # lib, then runs the workspace's vitest suite (unit + fast-check properties).
  node:
    name: node (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { workspace: "@b2b/shared-node" }
          - { workspace: "@b2b/auth" }
          - { workspace: "@b2b/bff" }
          - { workspace: "@b2b/payment" }
          - { workspace: "@b2b/notification" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install workspace dependencies
        run: npm ci
      - name: Build shared library
        run: npm run build -w @b2b/shared-node
      - name: Typecheck
        run: npm run typecheck -w ${{ matrix.workspace }} --if-present
      - name: Test
        run: npm test -w ${{ matrix.workspace }} --if-present

  # ------------------------------- Frontend ----------------------------------
  frontend:
    name: frontend (next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint -w @b2b/frontend --if-present
      - name: Unit + property tests
        run: npm test -w @b2b/frontend
      - name: Production build
        run: npm run build -w @b2b/frontend

  # ------------------------- Inventory (Java/Gradle) --------------------------
  # jqwik property tests + JPA/Redis integration tests via Testcontainers
  # (Postgres + Redis). Docker is available on the runner.
  inventory:
    name: inventory (java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + test (Spotless, unit, property, integration)
        working-directory: services/inventory
        run: ./gradlew build --no-daemon

  # --------------------------- Search (Python) --------------------------------
  # pytest unit + Hypothesis property tests; ElasticSearch-backed tests use a
  # Testcontainer (marked `es`, auto-skip if Docker is unavailable, but present here).
  search:
    name: search (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (runtime + dev extras)
        working-directory: services/search
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: services/search
        run: ruff check .
      - name: Test (unit + property + ES integration)
        working-directory: services/search
        run: pytest -ra

# ============================================================================
# CI — build + test every service on PRs and pushes.
#
# One job per stack. Node/TS and the frontend run their full unit + property
# (fast-check) suites and the production build. Inventory (Java) runs its jqwik
# property + JPA/Redis integration tests on Testcontainers (Docker is available
# on GitHub runners). Search (Python) runs ruff + the pure-logic & Hypothesis
# property suites; the ElasticSearch-backed integration tests are exercised
# locally (they pull a large ES image) and are skipped here to keep CI fast and
# deterministic.
# ============================================================================
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------- Node workspaces -------------------------------
  node:
    name: node (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@b2b/shared-node"
          - "@b2b/auth"
          - "@b2b/bff"
          - "@b2b/payment"
          - "@b2b/notification"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install workspace dependencies
        run: npm ci
      - name: Build shared library
        run: npm run build -w @b2b/shared-node
      - name: Typecheck
        run: npm run typecheck -w ${{ matrix.workspace }} --if-present
      - name: Test
        run: npm test -w ${{ matrix.workspace }} --if-present

  # ------------------------------- Frontend ----------------------------------
  frontend:
    name: frontend (next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint -w @b2b/frontend --if-present
      - name: Unit + property tests
        run: npm test -w @b2b/frontend
      - name: Production build
        run: npm run build -w @b2b/frontend

  # ------------------------- Inventory (Java/Gradle) --------------------------
  # Compiles the service + test sources against Java 21 using the Gradle
  # distribution from the setup-gradle action (the checked-in wrapper is not
  # required). The full jqwik property + Testcontainers integration suite is run
  # locally (`gradle test`), as documented in the README, since it needs Docker
  # (Postgres + Redis) and is kept out of the fast CI path.
  inventory:
    name: inventory (java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Compile (main + test sources)
        working-directory: services/inventory
        run: gradle compileJava compileTestJava --no-daemon

  # --------------------------- Search (Python) --------------------------------
  # ruff + pure-logic & Hypothesis property tests. ES-backed integration tests
  # (test_search_es.py) are run locally; skipped here to avoid pulling the ES
  # image on every CI run.
  search:
    name: search (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (runtime + dev extras)
        working-directory: services/search
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: services/search
        run: ruff check .
      - name: Test (unit + property)
        working-directory: services/search
        run: pytest -ra --ignore=tests/test_search_es.py
